[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cli"
version = "1.0.0"
description = "Command line client of the Grafana AI Agent: add users to the role store."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent-cli = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "app*"]
