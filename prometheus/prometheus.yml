# =============================================================================
# Prometheus Configuration: AI Agent Monitoring
# Reference: monitor.md (Slide 2 & Slide 3)
# =============================================================================

global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate alerting rules every 15 seconds
  scrape_timeout: 10s

# Alert rules defined for Golden Signals (Latency, Traffic, Errors, Saturation)
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # ---------------------------------------------------------------------------
  # 1. AI Agent Backend (FastAPI on Port 8000)
  # Scrapes adk_* telemetry metrics (Latency, Traffic, Errors, Saturation)
  # ---------------------------------------------------------------------------
  - job_name: "ai-agent-backend"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          # Use localhost:8000 when Prometheus runs directly on host (Windows binary)
          - "localhost:8000"
          # Use host.docker.internal:8000 when Prometheus runs inside a Docker container
          - "host.docker.internal:8000"
        labels:
          app: "grafana-ai-agent"
          tier: "backend"

  # ---------------------------------------------------------------------------
  # 2. Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # 3. Node Exporter (Host/Linux Hardware Metrics)
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:9100"
          - "localhost:9100"
        labels:
          instance: "node-1"

  # ---------------------------------------------------------------------------
  # 4. NVIDIA DCGM Exporter (GPU Telemetry - Port 9400 on GPU Hosts)
  # Scrapes NVIDIA GPU metrics (temperature, utilization, power, memory)
  # ---------------------------------------------------------------------------
  - job_name: "dcgm-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:9400"
          - "localhost:9400"
        labels:
          instance: "gpu-node-1"

