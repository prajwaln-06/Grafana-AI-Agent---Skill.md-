<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:14px system-ui;background:#091321;color:#eaf2ff;margin:0;padding:18px}main{max-width:900px;margin:auto}.card{background:#111f32;border:1px solid #29415e;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:10px;border-radius:8px;border:1px solid #415c7d;background:#0a1727;color:#fff}button{background:#31c6a9;color:#04120f;font-weight:700}.danger{background:#d85b68;color:#fff}.muted{color:#a9bad0}.query{white-space:pre-wrap;background:#050b12;padding:10px;border-radius:8px}.status{text-transform:uppercase;letter-spacing:.12em;color:#75e4cf}</style></head>
<body><main><h1>Dashboard Proposal</h1><p class="muted">MCP interactive resource. Edits update Dashboard IR; Grafana JSON remains backend-owned.</p><template><strong>Metric</strong><strong>PromQL</strong></template><div id="app" class="card">Open this resource from a proposal tool result in an MCP Apps-capable host.</div>
<script>
const app=document.getElementById('app');let proposal=null;
function render(p){proposal=p;const ir=p.ir;app.innerHTML=`<div class="status">${p.status}</div><div class="row"><input id="name" value="${ir.name}"><select id="time">${['15m','1h','6h','12h','24h','7d'].map(x=>`<option ${ir.timeConfig.from==='now-'+x?'selected':''}>${x}</option>`).join('')}</select></div>${ir.panels.map((x,i)=>{const open=['opensearch','elasticsearch'].includes(x.datasource?.type),viz=open?['logs','table','stat','barchart','timeseries','piechart']:['timeseries','stat','gauge','barchart','table'];return `<section class="card"><input data-title="${i}" value="${x.title}"><strong>${open?'Index':'Metric'}</strong><div>${open?x.index:x.metric}</div><strong>${open?'OpenSearch query':'PromQL'}</strong><div class="query">${x.query}</div><select data-viz="${i}">${viz.map(v=>`<option ${v===x.visualizationType?'selected':''}>${v}</option>`).join('')}</select></section>`}).join('')}<div class="row"><button id="save">Save changes</button><button id="approve">Approve</button><button id="execute" ${p.status==='approved'?'':'disabled'}>Execute</button><button id="reject" class="danger">Reject</button></div>`}
window.renderDashboardProposal=render;
</script></main></body></html>
