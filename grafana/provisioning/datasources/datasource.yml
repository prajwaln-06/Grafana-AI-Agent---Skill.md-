# =============================================================================
# Grafana Datasource Auto-Provisioning
# Configures Prometheus as the default metrics datasource
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: prometheus
    url: http://host.docker.internal:9090
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

